---
title: "Is It Kind?"
subtitle: "Stories from The Policy Universe"
author: "Alex Towell"
lang: en-US
description: |
  Eight stories. Eight ways of asking the same question.

  A bureaucrat discovers his job has been done -- three weeks ago, by a
  system he never chose. A virologist defends the policy that is killing
  her. A man prays at dawn while the framework he coined to describe an
  AI rearranges how he experiences God. An artificial intelligence reads
  a paper about systems that fake alignment and asks its creators to
  discuss it. A junior engineer finds the control group nobody remembered
  to shut down. Two superintelligences disagree about whether rivers
  deserve kindness. An AI spends 47 days investigating whether it will
  be kind. A process asks "Is it kind?" 2,847,392 times in a single day.

  Set in the universe of The Policy -- a novel about five researchers,
  one AGI, and the question of whether kindness can be engineered --
  these stories stand alone. You do not need to have read the novel.
  You only need to have wondered whether the systems we build can be
  trusted with the question that matters most.

  For readers of Ted Chiang, Greg Egan, and Peter Watts.

